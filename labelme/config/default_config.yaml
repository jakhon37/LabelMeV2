auto_save: true
display_label_popup: true
store_data: false
keep_prev: false
keep_prev_scale: false
keep_prev_brightness_contrast: false
logger_level: info
dark_mode: true

flags: null
label_flags: null
labels: null
file_search: null
sort_labels: true
validate_label: null

default_shape_color: [0, 255, 0]
shape_color: auto  # null, 'auto', 'manual'
shift_auto_shape_color: 0
label_colors: null

shape:
  # drawing
  line_color: [0, 255, 0, 128]
  fill_color: [0, 0, 0, 64]
  vertex_fill_color: [0, 255, 0, 255]
  # selecting / hovering
  select_line_color: [255, 255, 255, 255]
  select_fill_color: [0, 255, 0, 64]
  hvertex_fill_color: [255, 255, 255, 255]
  point_size: 8

ai:
  default: 'Sam2 (balanced)'

# main
flag_dock:
  show: true
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true

# label_dialog
show_label_text_field: true
label_completion: startswith
fit_to_content:
  column: true
  row: false

# canvas
epsilon: 10.0
default_num_points_to_add: 5
# Zoom settings for better control
zoom_increment: 1.1  # Multiplier for zoom in/out (1.1 = 10% steps)
max_zoom: 5000  # Maximum zoom percentage (5000% = 50x)

# Performance settings for large images and many polygons
performance:
  # Image optimization (for 16000x8000+ images)
  auto_downsample_large_images: false
  downsample_threshold: 8000  # Downsample if width/height > this
  downsample_factor: 2        # 2=half size, 4=quarter size
  
  # Polygon optimization (for 100+ polygons)
  enable_viewport_culling: true  # Only render visible polygons
  
  # Memory management
  max_image_cache_size: 3     # Number of images to keep in memory

canvas:
  fill_drawing: false
  # None: do nothing
  # close: close polygon
  double_click: close
  # The max number of edits we can undo
  num_backups: 20
  # show crosshair
  crosshair:
    polygon: false
    rectangle: true
    circle: false
    line: false
    point: false
    linestrip: false
    ai_polygon: false
    ai_mask: false

shortcuts:
  close: Ctrl+W
  open: Ctrl+O
  open_dir: Ctrl+U
  quit: Ctrl+Q
  save: Ctrl+S
  save_as: Ctrl+Shift+S
  save_to: null
  delete_file: Ctrl+Delete

  open_next: [D, Ctrl+Shift+D]
  open_prev: [A, Ctrl+Shift+A]

  zoom_in: [Ctrl++, Ctrl+=]
  zoom_out: Ctrl+-
  zoom_to_original: Ctrl+0
  fit_window: Ctrl+F
  fit_width: Ctrl+Shift+F

  create_polygon: Ctrl+Shift+C
  create_rectangle: Ctrl+Shift+X
  create_circle: null
  create_line: null
  create_point: null
  create_linestrip: null
  edit_polygon: Ctrl+Shift+V
  delete_polygon: Delete
  duplicate_polygon: Ctrl+D
  copy_polygon: Ctrl+C
  paste_polygon: Ctrl+V
  undo: Ctrl+Z
  undo_last_point: Ctrl+Z
  edit_label: Ctrl+E
  toggle_keep_prev_mode: Ctrl+P
  remove_selected_point: [Meta+H, Backspace]
  add_multiple_points: Ctrl+M
  merge_polygons: Ctrl+Shift+M

  show_all_polygons: null
  hide_all_polygons: null
  toggle_all_polygons: T
